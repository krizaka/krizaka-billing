# Verifies krizaka-billing on every change (unit tests, Testcontainers integration tests, javadoc,
# sources) after building the Krizaka repositories it stands on; on a v* tag signs the published
# modules and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fail before a tag: a pin of the org maven.yml older than be08be83 cannot write to GitHub Packages (a dead tag).
  maven-pin-guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: krizaka/.github/actions/maven-pin-guard@ea12aa78187da74ed63387383885c85606bf4051 # main

  maven:
    permissions:
      contents: read
      packages: write
    uses: krizaka/.github/.github/workflows/maven.yml@ea12aa78187da74ed63387383885c85606bf4051 # main
    with:
      registry: github   # GitHub Packages (ADR-019): krizaka-parent, the BOM and the kit resolve from there, no upstream checkout
      rewrite: true
    secrets: inherit # zizmor: ignore[secrets-inherit] the org's own pinned pipeline; it reads SONAR_TOKEN and nothing else of the repository's secrets
