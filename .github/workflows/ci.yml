# Verifies krizaka-billing on every change (unit tests, Testcontainers integration tests, javadoc,
# sources) after building the Krizaka repositories it stands on; on a v* tag signs the published
# modules and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@8844adc9ae48b368bd8f1b3c7b2492965cfe8d94 # main
    with:
      upstreams: "krizaka-build krizaka-platform-kit"
      rewrite: true
    secrets: inherit
